# Tells IndexNow search engines (Bing, and through it Copilot and ChatGPT
# search) which adjeet.in pages changed, once Vercel reports a successful
# production deployment. Pages count as changed when their sitemap lastmod,
# set in adjeet-site/content/page-reviews.ts, is recent. Run it by hand with
# "all" ticked to resubmit every URL.
name: IndexNow

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: Submit every sitemap URL, not only recently changed ones
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pages whose review date is within a week of the previous production
      # deploy are resubmitted. The week of overlap covers a branch that set its
      # dates a few days before it merged.
      - name: Work out which pages to submit
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SUBMIT_ALL: ${{ inputs.all }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          DEPLOYED_AT: ${{ github.event.deployment.created_at }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$SUBMIT_ALL" = "true" ]; then echo "args=--all" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "args=--since $(date -u -d '7 days ago' +%F)" >> "$GITHUB_OUTPUT"; exit 0
          fi
          previous=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=Production&per_page=30" \
            --jq "[.[] | select(.id != $DEPLOYMENT_ID and .created_at < \"$DEPLOYED_AT\")][0].created_at // empty")
          if [ -z "$previous" ]; then echo "args=--all" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "args=--since $(date -u -d "${previous%%T*} - 7 days" +%F)" >> "$GITHUB_OUTPUT"

      # Give the production domain a minute to switch to the new deployment,
      # so the sitemap read below is the one that just went live.
      - name: Wait for the domain to serve the new deployment
        if: github.event_name == 'deployment_status'
        run: sleep 60

      - name: Submit to IndexNow
        working-directory: adjeet-site
        run: node scripts/indexnow.mjs ${{ steps.scope.outputs.args }}
