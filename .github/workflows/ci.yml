name: CI
on: [push, pull_request]

# Nothing here writes to the repository or needs a secret. Declaring the
# token's scope keeps a changed repository default from widening it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The major Vercel builds production with, set by engines.node in
          # adjeet-site/package.json. .nvmrc, the e2e job and indexnow.yml match it.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: adjeet-site/package-lock.json

      # `npm ci`, so CI tests exactly the tree the lockfile records, which is
      # the tree Vercel builds. It used to be `npm install` because a lockfile
      # written on Windows can lack the transitive deps of platform-gated
      # optional packages (@emnapi/runtime for @img/sharp-wasm32, @emnapi/core
      # for the wasm32-wasi bindings), and `npm ci` refuses a lockfile with
      # such gaps. The lockfile now records them. If `npm ci` fails here with
      # "Missing: ... from lock file" after a dependency change, regenerate
      # the lockfile with the current npm 11 (`npm install`), and check that
      # every dependency edge in it resolves, instead of going back to
      # `npm install` in CI.
      - run: npm ci --no-audit --no-fund
        working-directory: adjeet-site

      - run: npm run lint
        working-directory: adjeet-site
      - run: npx tsc --noEmit
        working-directory: adjeet-site
      - run: npm run build
        working-directory: adjeet-site
        env:
          SKIP_ENV_VALIDATION: true
      - run: npm test
        working-directory: adjeet-site

  # The e2e suite was never run in CI, and 16 of its tests went stale on main
  # without anything flagging it. This job runs every spec on every push and PR.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: adjeet-site/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: adjeet-site
      - run: npx playwright install --with-deps chromium
        working-directory: adjeet-site

      # The suite runs against a production build, so it checks what ships.
      # No secrets are needed: every variable in lib/env.ts is optional, and the
      # lead form specs stub the Turnstile widget and intercept /api/lead, so no
      # spec submits a real lead. The site key is Cloudflare's public
      # always-pass test key; without one a production build renders LeadForm's
      # fallback instead of the form.
      - run: npm run build
        working-directory: adjeet-site
        env:
          SKIP_ENV_VALIDATION: true
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - run: npx playwright test
        working-directory: adjeet-site
        env:
          E2E_SERVER: production

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            adjeet-site/playwright-report/
            adjeet-site/test-results/
          retention-days: 7
