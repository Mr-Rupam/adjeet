name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The major Vercel builds production with, set by engines.node in
          # adjeet-site/package.json. .nvmrc, the e2e job and indexnow.yml match it.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: adjeet-site/package-lock.json

      # `npm install`, not `npm ci`, on purpose.
      #
      # This project is developed on Windows and built on Linux. Several
      # dependencies pull in optional, platform-gated native and wasm packages
      # (@rolldown/binding-wasm32-wasi, @tailwindcss/oxide-wasm32-wasi,
      # @img/sharp-*), and npm only resolves an optional package's own
      # dependencies on a platform where that package installs. A lockfile
      # generated on Windows therefore never records the transitive deps that
      # Linux needs, and `npm ci`, which validates the whole tree including
      # optional entries, refuses to install. That is what broke CI here from
      # May 2026 onward: every run failed at the install step, so lint, build
      # and tests had not actually run on any commit since.
      #
      # `npm install` resolves per-platform and succeeds. The tradeoff is that
      # CI no longer enforces the lockfile byte-for-byte. The proper fix is to
      # generate package-lock.json on Linux (in Docker or CI) and commit that,
      # at which point this can go back to `npm ci`.
      - run: npm install --no-audit --no-fund
        working-directory: adjeet-site

      - run: npm run lint
        working-directory: adjeet-site
      - run: npx tsc --noEmit
        working-directory: adjeet-site
      - run: npm run build
        working-directory: adjeet-site
        env:
          SKIP_ENV_VALIDATION: true
      - run: npm test
        working-directory: adjeet-site

  # The e2e suite was never run in CI, and 16 of its tests went stale on main
  # without anything flagging it. This job runs every spec on every push and PR.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: adjeet-site/package-lock.json

      # `npm install`, not `npm ci`, for the lockfile reason given in the build job.
      - run: npm install --no-audit --no-fund
        working-directory: adjeet-site
      - run: npx playwright install --with-deps chromium
        working-directory: adjeet-site

      # The suite runs against a production build, so it checks what ships.
      # No secrets are needed: every variable in lib/env.ts is optional, and the
      # lead form specs stub the Turnstile widget and intercept /api/lead, so no
      # spec submits a real lead. The site key is Cloudflare's public
      # always-pass test key; without one a production build renders LeadForm's
      # fallback instead of the form.
      - run: npm run build
        working-directory: adjeet-site
        env:
          SKIP_ENV_VALIDATION: true
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - run: npx playwright test
        working-directory: adjeet-site
        env:
          E2E_SERVER: production

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            adjeet-site/playwright-report/
            adjeet-site/test-results/
          retention-days: 7
